version: '3.8'

# SQL Server Database - Base Service

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      ibox-network:
        ipv4_address: 172.18.0.10
      mock-kafka-net: {}

networks:
  ibox-network:
    external: true
    name: ibox-network
  mock-kafka-net:
    external: true
    name: mock-kafka-net

volumes:
  sqlserver_data:
