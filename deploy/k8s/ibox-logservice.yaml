apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibox-logservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibox-logservice
  template:
    metadata:
      labels:
        app: ibox-logservice
    spec:
      containers:
        - name: ibox-logservice
          image: your-registry/ibox-logservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5000
          envFrom:
            - configMapRef:
                name: ibox-config
            - secretRef:
                name: ibox-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: logs
              mountPath: /app/Logs
            - name: chatbot-db
              mountPath: /app/DataBaseChatBot
            - name: ibox-log-db
              mountPath: /app/DatabaseLogIBox
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: ibox-logs-pvc
        - name: chatbot-db
          persistentVolumeClaim:
            claimName: ibox-chatbot-db-pvc
        - name: ibox-log-db
          persistentVolumeClaim:
            claimName: ibox-log-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ibox-logservice
spec:
  selector:
    app: ibox-logservice
  ports:
    - name: http
      port: 80
      targetPort: 5000
