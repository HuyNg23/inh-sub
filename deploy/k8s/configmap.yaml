apiVersion: v1
kind: ConfigMap
metadata:
  name: ibox-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # Database timeout
  Database__Timeout: "30"
  # CORS configuration
  CORSWhileList__0: "http://localhost:3000"
  CORSWhileList__1: "http://localhost:3001"
  CORSWhileList__2: "https://your-frontend-domain.com"
  CORSHeaderRequired__0: "Content-Type"
  CORSHeaderRequired__1: "Authorization"
  # JWT configuration
  JWT__Issuer: "IBOX"
  JWT__TotalMinuteAlive: "30"
  # Logging configuration
  retainedFileCountLimit: "300"
  fileSizeLimitBytes: "10000000"
  # Schedule cron expressions
  Schedule__RuntimeSchedule: "0 01 01 ? * * *"
  Schedule__RuntimeJobAutoStart: "0 02 01 ? * * *"
  # File management
  ZipFileDay: "2"
  MaxZipFileCount: "15"
  TypeProtocol: "0"
  # Inter-service communication URLs (K8s service names)
  ServiceUrls__RestService: "http://ibox-restservice:80"
  ServiceUrls__LogService: "http://ibox-logservice:80"
  ServiceUrls__RootClient: "http://ibox-root-client:80"
  ServiceUrls__Schedule: "http://ibox-schedule:80"
  ServiceUrls__StoreService: "http://ibox-storeservice:80"
  ServiceUrls__Client: "http://ibox-client:80"
