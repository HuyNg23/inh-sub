apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ibox-logs-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: azurefile  # Change to match your storage class
